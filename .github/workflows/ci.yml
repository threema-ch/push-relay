on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "30 3 * * 4"

name: CI

jobs:
  test:
    name: run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - run: cargo test --all-features

  clippy:
    name: run clippy lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features -- -D warnings

  fmt:
    name: run rustfmt
    runs-on: ubuntu-latest
    env:
      NIGHTLY_DATE: "2026-10-23"
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly-$NIGHTLY_DATE --component rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly-$NIGHTLY_DATE fmt --all --check

  audit:
    name: run cargo audit
    runs-on: ubuntu-latest
    container: dbrgn/cargo-audit:latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo audit
